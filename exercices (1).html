<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Académie – Exercices</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%233b2f8f'/%3E%3Ctext x='50' y='70' font-size='64' text-anchor='middle'%3E%F0%9F%8E%BC%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <style>
    .tool { max-width: 820px; margin: 0 auto 30px; background: #fff; border-radius: 16px; padding: 26px; box-shadow: 0 4px 16px rgba(0,0,0,.08); text-align: center; }
    .tool h2 { font-size: 1.5rem; margin-bottom: 8px; }
    .hint { color: #555; margin-bottom: 18px; }
    .piano { position: relative; display: inline-flex; height: 190px; direction: ltr; user-select: none; touch-action: manipulation; }
    .white { width: 54px; height: 190px; background: #fff; border: 1px solid #333; border-radius: 0 0 8px 8px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; font-size: .8rem; color: #555; cursor: pointer; }
    .white.on { background: #ffe08a; }
    .black { position: absolute; width: 34px; height: 115px; background: #1b1f3b; border-radius: 0 0 6px 6px; z-index: 2; cursor: pointer; }
    .black.on { background: #c2417a; }
    .notes { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 16px 0; }
    .notes button, .ctrl button { padding: 10px 18px; border: 0; border-radius: 22px; background: #3b2f8f; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    .notes button:hover, .ctrl button:hover { background: #c2417a; }
    .ctrl { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: center; margin-top: 14px; }
    .msg { min-height: 28px; font-weight: 700; margin-top: 10px; }
    .ok { color: #1b8a3b; } .ko { color: #c0262d; }
    .beat { width: 22px; height: 22px; border-radius: 50%; background: #ddd; display: inline-block; margin: 0 auto 10px; }
    .beat.tick { background: #ffb703; }
    input[type=range] { width: 220px; }
    .pads { display: grid; grid-template-columns: repeat(2, 110px); gap: 12px; justify-content: center; margin: 10px 0 16px; }
    .pad { height: 90px; border: 0; border-radius: 16px; cursor: pointer; opacity: .55; transition: opacity .1s, transform .1s; }
    .pad.lit { opacity: 1; transform: scale(1.06); }
    .p0 { background: #e63946; } .p1 { background: #2a9d8f; } .p2 { background: #ffb703; } .p3 { background: #3b82f6; }
  </style>
</head>
<body>
  <header class="header">
    <a href="index.html" class="logo">🎼 Music Académie</a>
    <nav><a href="index.html" data-i18n="back"></a></nav>
    <div class="lang">
      <button data-lang="ar">العربية</button>
      <button data-lang="fr">FR</button>
      <button data-lang="en">EN</button>
      <button data-lang="es">ES</button>
    </div>
  </header>

  <section class="hero" style="padding:60px 6%">
    <h1 data-i18n="title"></h1>
    <p data-i18n="subtitle"></p>
  </section>

  <section class="section">
    <div class="tool">
      <h2 data-i18n="piano_title"></h2>
      <p class="hint" data-i18n="piano_hint"></p>
      <div class="piano" id="piano"></div>
    </div>

    <div class="tool">
      <h2 data-i18n="ear_title"></h2>
      <p class="hint" data-i18n="ear_hint"></p>
      <div class="ctrl"><button id="playNote" data-i18n="play"></button></div>
      <div class="notes" id="choices"></div>
      <div class="msg" id="earMsg"></div>
      <div><strong data-i18n="score"></strong> <span id="score">0 / 0</span></div>
    </div>

    <div class="tool">
      <h2 data-i18n="chord_title"></h2>
      <p class="hint" data-i18n="chord_hint"></p>
      <div class="ctrl"><button id="playChord" data-i18n="play_chord"></button></div>
      <div class="notes" id="chordChoices"></div>
      <div class="msg" id="chordMsg"></div>
      <div><strong data-i18n="score"></strong> <span id="chordScore">0 / 0</span></div>
    </div>

    <div class="tool">
      <h2 data-i18n="read_title"></h2>
      <p class="hint" data-i18n="read_hint"></p>
      <svg id="staffSvg" viewBox="0 0 300 110" width="320" height="118" role="img" aria-label="staff"></svg>
      <div class="notes" id="readChoices"></div>
      <div class="msg" id="readMsg"></div>
      <div><strong data-i18n="score"></strong> <span id="readScore">0 / 0</span></div>
    </div>

    <div class="tool">
      <h2 data-i18n="int_title"></h2>
      <p class="hint" data-i18n="int_hint"></p>
      <div class="ctrl"><button id="playInt" data-i18n="play_int"></button></div>
      <div class="notes" id="intChoices"></div>
      <div class="msg" id="intMsg"></div>
      <div><strong data-i18n="score"></strong> <span id="intScore">0 / 0</span></div>
    </div>

    <div class="tool">
      <h2 data-i18n="hl_title"></h2>
      <p class="hint" data-i18n="hl_hint"></p>
      <div class="ctrl"><button id="playHl" data-i18n="play_hl"></button></div>
      <div class="notes" id="hlChoices"></div>
      <div class="msg" id="hlMsg"></div>
      <div><strong data-i18n="score"></strong> <span id="hlScore">0 / 0</span></div>
    </div>

    <div class="tool">
      <h2 data-i18n="mem_title"></h2>
      <p class="hint" data-i18n="mem_hint"></p>
      <div class="pads" id="memPads">
        <button class="pad p0" data-p="0"></button><button class="pad p1" data-p="1"></button>
        <button class="pad p2" data-p="2"></button><button class="pad p3" data-p="3"></button>
      </div>
      <div class="ctrl"><button id="memBtn" data-i18n="mem_start"></button></div>
      <div class="msg" id="memMsg"></div>
      <div><strong data-i18n="mem_best"></strong> <span id="memBest">0</span></div>
    </div>

    <div class="tool">
      <h2 data-i18n="rhythm_title"></h2>
      <p class="hint" data-i18n="rhythm_hint"></p>
      <div class="beat" id="rBeat"></div>
      <div class="ctrl">
        <label><span data-i18n="bpm"></span> <strong id="rBpmVal">80</strong></label>
        <input type="range" id="rBpm" min="60" max="140" value="80">
        <button id="rBtn" data-i18n="start"></button>
      </div>
      <div class="ctrl"><button id="tapBtn" style="padding:18px 60px;font-size:1.2rem" data-i18n="tap"></button></div>
      <div class="msg" id="rMsg"></div>
      <div><strong data-i18n="taps"></strong> <span id="rCount">0</span> &nbsp;|&nbsp; <strong data-i18n="avg"></strong> <span id="rAvg">–</span></div>
    </div>

    <div class="tool">
      <h2 data-i18n="metro_title"></h2>
      <div class="beat" id="beat"></div>
      <div class="ctrl">
        <label><span data-i18n="bpm"></span> <strong id="bpmVal">80</strong></label>
        <input type="range" id="bpm" min="40" max="200" value="80">
        <button id="metroBtn" data-i18n="start"></button>
      </div>
    </div>
  </section>

  <footer class="footer">© 2026 Music Académie</footer>

  <script>
    var T = {
      fr: { back:"← Retour au site", title:"Exercices interactifs", subtitle:"Entraînez-vous directement dans votre navigateur.",
        piano_title:"Piano virtuel", piano_hint:"Cliquez sur les touches, ou utilisez le clavier : A S D F G H J (touches blanches) et W E T Y U (touches noires).",
        ear_title:"Entraînement de l'oreille", ear_hint:"Écoutez la note puis choisissez son nom.",
        read_title:"Lecture de notes", read_hint:"Clé de sol : quelle est cette note ?",
        chord_title:"Accords majeur / mineur", chord_hint:"Écoutez l'accord : sonne-t-il joyeux (majeur) ou triste (mineur) ?",
        play_chord:"▶ Jouer un accord", major:"Majeur", minor:"Mineur",
        rhythm_title:"Jeu de rythme", rhythm_hint:"Appuyez sur le bouton (ou la barre d'espace) en rythme avec le clic.",
        tap:"TAP", taps:"Appuis :", avg:"Écart moyen :", perfect:"Parfait ! 🎯", early:"Trop tôt", late:"Trop tard",
        int_title:"Intervalles", int_hint:"Écoutez deux notes et trouvez l'intervalle entre elles.", play_int:"▶ Jouer un intervalle",
        i2:"Seconde", i3:"Tierce", i5:"Quinte", i8:"Octave",
        hl_title:"Plus aigu ou plus grave ?", hl_hint:"Deux notes sont jouées : laquelle est la plus aiguë ?", play_hl:"▶ Jouer deux notes", hl_first:"La première", hl_second:"La seconde",
        mem_title:"Jeu de mémoire musicale", mem_hint:"Écoutez la séquence puis répétez-la en appuyant sur les pastilles de couleur.", mem_start:"Nouvelle partie", mem_best:"Meilleur niveau :", mem_watch:"Écoutez…", mem_go:"À vous !", mem_over:"Perdu ! Niveau atteint : ",
        play:"▶ Jouer une note", score:"Score :", good:"Bravo ! ✔", bad:"Raté, c'était : ",
        metro_title:"Métronome", bpm:"Tempo (BPM) :", start:"Démarrer", stop:"Arrêter",
        names:["Do","Ré","Mi","Fa","Sol","La","Si"] },
      en: { back:"← Back to site", title:"Interactive exercises", subtitle:"Practice right in your browser.",
        piano_title:"Virtual piano", piano_hint:"Click the keys, or use your keyboard: A S D F G H J (white keys) and W E T Y U (black keys).",
        ear_title:"Ear training", ear_hint:"Listen to the note, then pick its name.",
        read_title:"Note reading", read_hint:"Treble clef: which note is this?",
        chord_title:"Major / minor chords", chord_hint:"Listen to the chord: does it sound happy (major) or sad (minor)?",
        play_chord:"▶ Play a chord", major:"Major", minor:"Minor",
        rhythm_title:"Rhythm game", rhythm_hint:"Press the button (or the space bar) in time with the click.",
        tap:"TAP", taps:"Taps:", avg:"Average error:", perfect:"Perfect! 🎯", early:"Too early", late:"Too late",
        int_title:"Intervals", int_hint:"Listen to two notes and find the interval between them.", play_int:"▶ Play an interval",
        i2:"Second", i3:"Third", i5:"Fifth", i8:"Octave",
        hl_title:"Higher or lower?", hl_hint:"Two notes are played: which one is higher?", play_hl:"▶ Play two notes", hl_first:"The first", hl_second:"The second",
        mem_title:"Music memory game", mem_hint:"Listen to the sequence, then repeat it by pressing the colored pads.", mem_start:"New game", mem_best:"Best level:", mem_watch:"Listen…", mem_go:"Your turn!", mem_over:"Game over! Level reached: ",
        play:"▶ Play a note", score:"Score:", good:"Well done! ✔", bad:"Missed, it was: ",
        metro_title:"Metronome", bpm:"Tempo (BPM):", start:"Start", stop:"Stop",
        names:["C","D","E","F","G","A","B"] },
      es: { back:"← Volver al sitio", title:"Ejercicios interactivos", subtitle:"Practica directamente en tu navegador.",
        piano_title:"Piano virtual", piano_hint:"Haz clic en las teclas o usa el teclado: A S D F G H J (teclas blancas) y W E T Y U (teclas negras).",
        ear_title:"Entrenamiento del oído", ear_hint:"Escucha la nota y elige su nombre.",
        read_title:"Lectura de notas", read_hint:"Clave de sol: ¿qué nota es esta?",
        chord_title:"Acordes mayor / menor", chord_hint:"Escucha el acorde: ¿suena alegre (mayor) o triste (menor)?",
        play_chord:"▶ Tocar un acorde", major:"Mayor", minor:"Menor",
        rhythm_title:"Juego de ritmo", rhythm_hint:"Pulsa el botón (o la barra espaciadora) al ritmo del clic.",
        tap:"TAP", taps:"Pulsaciones:", avg:"Error medio:", perfect:"¡Perfecto! 🎯", early:"Muy pronto", late:"Muy tarde",
        int_title:"Intervalos", int_hint:"Escucha dos notas y encuentra el intervalo entre ellas.", play_int:"▶ Tocar un intervalo",
        i2:"Segunda", i3:"Tercera", i5:"Quinta", i8:"Octava",
        hl_title:"¿Más agudo o más grave?", hl_hint:"Suenan dos notas: ¿cuál es la más aguda?", play_hl:"▶ Tocar dos notas", hl_first:"La primera", hl_second:"La segunda",
        mem_title:"Juego de memoria musical", mem_hint:"Escucha la secuencia y repítela pulsando los botones de color.", mem_start:"Nueva partida", mem_best:"Mejor nivel:", mem_watch:"Escucha…", mem_go:"¡Tu turno!", mem_over:"¡Fin! Nivel alcanzado: ",
        play:"▶ Tocar una nota", score:"Puntuación:", good:"¡Muy bien! ✔", bad:"Fallaste, era: ",
        metro_title:"Metrónomo", bpm:"Tempo (BPM):", start:"Iniciar", stop:"Detener",
        names:["Do","Re","Mi","Fa","Sol","La","Si"] },
      ar: { back:"← العودة إلى الموقع", title:"تمارين تفاعلية", subtitle:"تدرّب مباشرة داخل المتصفح.",
        piano_title:"بيانو افتراضي", piano_hint:"اضغط على المفاتيح أو استخدم لوحة المفاتيح: A S D F G H J (المفاتيح البيضاء) وW E T Y U (المفاتيح السوداء).",
        ear_title:"تدريب الأذن", ear_hint:"استمع إلى النوتة ثم اختر اسمها.",
        read_title:"قراءة النوتات", read_hint:"مفتاح صول: ما هذه النوتة؟",
        chord_title:"الأكوردات الكبيرة / الصغيرة", chord_hint:"استمع إلى الأكورد: هل يبدو مبهجاً (كبير) أم حزيناً (صغير)؟",
        play_chord:"▶ شغّل أكورداً", major:"كبير", minor:"صغير",
        rhythm_title:"لعبة الإيقاع", rhythm_hint:"اضغط على الزر (أو مفتاح المسافة) مع نقرات الإيقاع.",
        tap:"اضغط", taps:"عدد الضغطات:", avg:"متوسط الخطأ:", perfect:"ممتاز! 🎯", early:"مبكر جداً", late:"متأخر جداً",
        int_title:"الفواصل الموسيقية", int_hint:"استمع إلى نوتتين واعرف الفاصل بينهما.", play_int:"▶ شغّل فاصلاً",
        i2:"ثانية", i3:"ثالثة", i5:"خامسة", i8:"أوكتاف",
        hl_title:"أحدّ أم أغلظ؟", hl_hint:"تُعزف نوتتان: أيّهما أحدّ؟", play_hl:"▶ شغّل نوتتين", hl_first:"الأولى", hl_second:"الثانية",
        mem_title:"لعبة الذاكرة الموسيقية", mem_hint:"استمع إلى التسلسل ثم كرّره بالضغط على الأزرار الملونة.", mem_start:"لعبة جديدة", mem_best:"أفضل مستوى:", mem_watch:"استمع…", mem_go:"دورك!", mem_over:"انتهت اللعبة! المستوى الذي بلغته: ",
        play:"▶ شغّل نوتة", score:"النتيجة:", good:"أحسنت! ✔", bad:"أخطأت، كانت: ",
        metro_title:"مترونوم", bpm:"السرعة (BPM):", start:"ابدأ", stop:"إيقاف",
        names:["دو","ري","مي","فا","صول","لا","سي"] }
    };

    var lang = "fr";
    try { lang = localStorage.getItem("lang") || "fr"; } catch (e) {}
    if (!T[lang]) lang = "fr";

    /* ---------- Audio ---------- */
    var ctx = null;
    function audio() {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") ctx.resume();
      return ctx;
    }
    function tone(freq, dur) {
      var c = audio(), o = c.createOscillator(), g = c.createGain();
      o.type = "triangle"; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.5, c.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
      o.connect(g); g.connect(c.destination);
      o.start(); o.stop(c.currentTime + dur + 0.05);
    }

    /* ---------- Piano ---------- */
    var WHITE = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
    var WKEYS = ["a","s","d","f","g","h","j","k"];
    var BLACK = [{f:277.18, pos:0, k:"w"}, {f:311.13, pos:1, k:"e"}, {f:369.99, pos:3, k:"t"}, {f:415.30, pos:4, k:"y"}, {f:466.16, pos:5, k:"u"}];
    var piano = document.getElementById("piano");
    var keyEls = {};

    WHITE.forEach(function (f, i) {
      var d = document.createElement("div");
      d.className = "white";
      d.textContent = WKEYS[i].toUpperCase();
      bind(d, f);
      piano.appendChild(d);
      keyEls[WKEYS[i]] = d;
    });
    BLACK.forEach(function (b) {
      var d = document.createElement("div");
      d.className = "black";
      d.style.left = (b.pos * 54 + 54 - 17) + "px";
      bind(d, b.f);
      piano.appendChild(d);
      keyEls[b.k] = d;
    });
    var freqByKey = {};
    WKEYS.forEach(function (k, i) { freqByKey[k] = WHITE[i]; });
    BLACK.forEach(function (b) { freqByKey[b.k] = b.f; });

    function press(el, f) { tone(f, 0.9); el.classList.add("on"); setTimeout(function () { el.classList.remove("on"); }, 180); }
    function bind(el, f) {
      el.addEventListener("pointerdown", function (e) { e.preventDefault(); press(el, f); });
    }
    document.addEventListener("keydown", function (e) {
      if (e.repeat) return;
      var k = e.key.toLowerCase();
      if (freqByKey[k]) press(keyEls[k], freqByKey[k]);
    });

    /* ---------- Ear training ---------- */
    var NOTES7 = WHITE.slice(0, 7);
    var current = -1, answered = true, good = 0, total = 0;
    var choices = document.getElementById("choices");
    var earMsg = document.getElementById("earMsg");

    function buildChoices() {
      choices.innerHTML = "";
      T[lang].names.forEach(function (n, i) {
        var b = document.createElement("button");
        b.textContent = n;
        b.addEventListener("click", function () { answer(i); });
        choices.appendChild(b);
      });
    }
    document.getElementById("playNote").addEventListener("click", function () {
      if (answered) { current = Math.floor(Math.random() * 7); answered = false; earMsg.textContent = ""; }
      tone(NOTES7[current], 1.2);
    });
    function answer(i) {
      if (current < 0) return;
      if (answered) return;
      answered = true; total++;
      if (i === current) { good++; earMsg.textContent = T[lang].good; earMsg.className = "msg ok"; }
      else { earMsg.textContent = T[lang].bad + T[lang].names[current]; earMsg.className = "msg ko"; }
      document.getElementById("score").textContent = good + " / " + total;
    }

    /* ---------- Accords majeur / mineur ---------- */
    var cMajor = true, cAnswered = true, cStarted = false, cGood = 0, cTotal = 0, cSemis = 0;
    var chordChoices = document.getElementById("chordChoices");
    var chordMsg = document.getElementById("chordMsg");

    function playChord() {
      var root = 261.63 * Math.pow(2, cSemis / 12);
      var third = root * Math.pow(2, (cMajor ? 4 : 3) / 12);
      var fifth = root * Math.pow(2, 7 / 12);
      tone(root, 1.8); tone(third, 1.8); tone(fifth, 1.8);
    }
    document.getElementById("playChord").addEventListener("click", function () {
      if (cAnswered) {
        cSemis = Math.floor(Math.random() * 12);
        cMajor = Math.random() < 0.5;
        cAnswered = false; cStarted = true;
        chordMsg.textContent = "";
      }
      playChord();
    });
    function buildChordChoices() {
      chordChoices.innerHTML = "";
      [true, false].forEach(function (isMajor) {
        var b = document.createElement("button");
        b.textContent = isMajor ? T[lang].major : T[lang].minor;
        b.addEventListener("click", function () { answerChord(isMajor); });
        chordChoices.appendChild(b);
      });
    }
    function answerChord(isMajor) {
      if (!cStarted || cAnswered) return;
      cAnswered = true; cTotal++;
      if (isMajor === cMajor) { cGood++; chordMsg.textContent = T[lang].good; chordMsg.className = "msg ok"; }
      else { chordMsg.textContent = T[lang].bad + (cMajor ? T[lang].major : T[lang].minor); chordMsg.className = "msg ko"; }
      document.getElementById("chordScore").textContent = cGood + " / " + cTotal;
    }

    /* ---------- Lecture de notes ---------- */
    var rIdx = 0, rAnswered = false, rGood = 0, rTotal = 0;
    var staffSvg = document.getElementById("staffSvg");
    var readChoices = document.getElementById("readChoices");
    var readMsg = document.getElementById("readMsg");

    function drawNote(idx) {
      var y = 80 - idx * 5, cx = 150, s = "";
      for (var i = 0; i < 5; i++) {
        var ly = 30 + i * 10;
        s += '<line x1="20" y1="' + ly + '" x2="280" y2="' + ly + '" stroke="currentColor" stroke-width="1.2"/>';
      }
      if (idx <= 0) s += '<line x1="132" y1="80" x2="168" y2="80" stroke="currentColor" stroke-width="1.2"/>';
      if (idx >= 12) s += '<line x1="132" y1="20" x2="168" y2="20" stroke="currentColor" stroke-width="1.2"/>';
      s += '<ellipse cx="' + cx + '" cy="' + y + '" rx="7.5" ry="5.2" fill="currentColor" transform="rotate(-15 ' + cx + ' ' + y + ')"/>';
      if (idx < 6) s += '<line x1="' + (cx + 7) + '" y1="' + y + '" x2="' + (cx + 7) + '" y2="' + (y - 30) + '" stroke="currentColor" stroke-width="1.5"/>';
      else s += '<line x1="' + (cx - 7) + '" y1="' + y + '" x2="' + (cx - 7) + '" y2="' + (y + 30) + '" stroke="currentColor" stroke-width="1.5"/>';
      staffSvg.innerHTML = s;
    }
    function newReadNote() {
      rIdx = Math.floor(Math.random() * 13);
      rAnswered = false;
      readMsg.textContent = "";
      drawNote(rIdx);
    }
    function buildReadChoices() {
      readChoices.innerHTML = "";
      T[lang].names.forEach(function (n, i) {
        var b = document.createElement("button");
        b.textContent = n;
        b.addEventListener("click", function () { answerRead(i); });
        readChoices.appendChild(b);
      });
    }
    function answerRead(i) {
      if (rAnswered) return;
      rAnswered = true; rTotal++;
      var right = rIdx % 7;
      if (i === right) { rGood++; readMsg.textContent = T[lang].good; readMsg.className = "msg ok"; }
      else { readMsg.textContent = T[lang].bad + T[lang].names[right]; readMsg.className = "msg ko"; }
      document.getElementById("readScore").textContent = rGood + " / " + rTotal;
      setTimeout(newReadNote, 1300);
    }

    /* ---------- Intervalles ---------- */
    var INTS = [{ s: 2, k: "i2" }, { s: 4, k: "i3" }, { s: 7, k: "i5" }, { s: 12, k: "i8" }];
    var iPick = 0, iBase = 261.63, iAnswered = true, iStarted = false, iGood = 0, iTotal = 0;
    var intChoices = document.getElementById("intChoices"), intMsg = document.getElementById("intMsg");

    function playInt() {
      var top = iBase * Math.pow(2, INTS[iPick].s / 12);
      tone(iBase, 0.9);
      setTimeout(function () { tone(top, 1.1); }, 800);
    }
    document.getElementById("playInt").addEventListener("click", function () {
      if (iAnswered) {
        iPick = Math.floor(Math.random() * INTS.length);
        iBase = 261.63 * Math.pow(2, Math.floor(Math.random() * 12) / 12);
        iAnswered = false; iStarted = true; intMsg.textContent = "";
      }
      playInt();
    });
    function buildIntChoices() {
      intChoices.innerHTML = "";
      INTS.forEach(function (it, i) {
        var b = document.createElement("button");
        b.textContent = T[lang][it.k];
        b.addEventListener("click", function () { answerInt(i); });
        intChoices.appendChild(b);
      });
    }
    function answerInt(i) {
      if (!iStarted || iAnswered) return;
      iAnswered = true; iTotal++;
      if (i === iPick) { iGood++; intMsg.textContent = T[lang].good; intMsg.className = "msg ok"; }
      else { intMsg.textContent = T[lang].bad + T[lang][INTS[iPick].k]; intMsg.className = "msg ko"; }
      document.getElementById("intScore").textContent = iGood + " / " + iTotal;
    }

    /* ---------- Plus aigu / plus grave ---------- */
    var hF1 = 261.63, hF2 = 329.63, hAnswered = true, hStarted = false, hGood = 0, hTotal = 0;
    var hlChoices = document.getElementById("hlChoices"), hlMsg = document.getElementById("hlMsg");
    document.getElementById("playHl").addEventListener("click", function () {
      if (hAnswered) {
        hF1 = 261.63 * Math.pow(2, Math.floor(Math.random() * 13) / 12);
        var d = 1 + Math.floor(Math.random() * 7);
        if (Math.random() < 0.5) d = -d;
        hF2 = hF1 * Math.pow(2, d / 12);
        hAnswered = false; hStarted = true; hlMsg.textContent = "";
      }
      tone(hF1, 0.8);
      setTimeout(function () { tone(hF2, 0.8); }, 800);
    });
    function buildHlChoices() {
      hlChoices.innerHTML = "";
      ["hl_first", "hl_second"].forEach(function (k, i) {
        var b = document.createElement("button");
        b.textContent = T[lang][k];
        b.addEventListener("click", function () { answerHl(i); });
        hlChoices.appendChild(b);
      });
    }
    function answerHl(i) {
      if (!hStarted || hAnswered) return;
      hAnswered = true; hTotal++;
      var right = hF1 > hF2 ? 0 : 1;
      if (i === right) { hGood++; hlMsg.textContent = T[lang].good; hlMsg.className = "msg ok"; }
      else { hlMsg.textContent = T[lang].bad + T[lang][right === 0 ? "hl_first" : "hl_second"]; hlMsg.className = "msg ko"; }
      document.getElementById("hlScore").textContent = hGood + " / " + hTotal;
    }

    /* ---------- Mémoire musicale ---------- */
    var PADF = [261.63, 329.63, 392.00, 523.25];
    var memSeq = [], memPos = 0, memBusy = true, memActive = false;
    var memPads = document.querySelectorAll(".pad"), memMsg = document.getElementById("memMsg");
    var memBestEl = document.getElementById("memBest"), memBest = 0;
    try { memBest = Number(localStorage.getItem("memBest")) || 0; } catch (e) {}
    memBestEl.textContent = memBest;

    function flashPad(p) {
      tone(PADF[p], 0.45);
      memPads[p].classList.add("lit");
      setTimeout(function () { memPads[p].classList.remove("lit"); }, 280);
    }
    function playSeq() {
      memBusy = true; memMsg.textContent = T[lang].mem_watch; memMsg.className = "msg";
      memSeq.forEach(function (p, i) { setTimeout(function () { flashPad(p); }, 700 + i * 600); });
      setTimeout(function () { memBusy = false; memPos = 0; memMsg.textContent = T[lang].mem_go; }, 700 + memSeq.length * 600);
    }
    function nextRound() { memSeq.push(Math.floor(Math.random() * 4)); playSeq(); }
    document.getElementById("memBtn").addEventListener("click", function () {
      audio(); memSeq = []; memActive = true; nextRound();
    });
    memPads.forEach(function (el) {
      el.addEventListener("pointerdown", function (e) {
        e.preventDefault();
        if (!memActive || memBusy) return;
        var p = Number(el.getAttribute("data-p"));
        flashPad(p);
        if (p !== memSeq[memPos]) {
          memActive = false;
          var reached = memSeq.length - 1;
          memMsg.textContent = T[lang].mem_over + reached; memMsg.className = "msg ko";
          if (reached > memBest) {
            memBest = reached; memBestEl.textContent = memBest;
            try { localStorage.setItem("memBest", String(memBest)); } catch (er) {}
          }
          return;
        }
        memPos++;
        if (memPos === memSeq.length) { memBusy = true; setTimeout(nextRound, 900); }
      });
    });

    /* ---------- Jeu de rythme ---------- */
    var rRunning = false, rT0 = 0, rN = 0, rTimer = null, rI = 750, rErr = [];
    var rBpm = document.getElementById("rBpm"), rBpmVal = document.getElementById("rBpmVal");
    var rBtn = document.getElementById("rBtn"), rBeat = document.getElementById("rBeat");
    var rMsg = document.getElementById("rMsg");

    function rTick() {
      tone(rN % 4 === 0 ? 1000 : 700, 0.07);
      rBeat.classList.add("tick"); setTimeout(function () { rBeat.classList.remove("tick"); }, 100);
      rN++;
      rTimer = setTimeout(rTick, Math.max(0, rT0 + rN * rI - performance.now()));
    }
    function rStart() {
      audio();
      rI = 60000 / Number(rBpm.value);
      rErr = []; rN = 0;
      document.getElementById("rCount").textContent = "0";
      document.getElementById("rAvg").textContent = "–";
      rMsg.textContent = "";
      rT0 = performance.now() + 400;
      rRunning = true;
      rTimer = setTimeout(rTick, 400);
      rBtn.textContent = T[lang].stop;
    }
    function rStop() {
      rRunning = false; clearTimeout(rTimer);
      rBtn.textContent = T[lang].start;
    }
    function rTap() {
      if (!rRunning) return;
      var now = performance.now();
      var k = Math.max(0, Math.round((now - rT0) / rI));
      var off = now - (rT0 + k * rI);
      rErr.push(Math.abs(off));
      var avg = rErr.reduce(function (a, b) { return a + b; }, 0) / rErr.length;
      document.getElementById("rCount").textContent = rErr.length;
      document.getElementById("rAvg").textContent = Math.round(avg) + " ms";
      if (Math.abs(off) <= 50) { rMsg.textContent = T[lang].perfect; rMsg.className = "msg ok"; }
      else { rMsg.textContent = (off < 0 ? T[lang].early : T[lang].late) + " (" + Math.round(Math.abs(off)) + " ms)"; rMsg.className = "msg ko"; }
    }
    rBtn.addEventListener("click", function () { if (rRunning) rStop(); else rStart(); });
    document.getElementById("tapBtn").addEventListener("pointerdown", function (e) { e.preventDefault(); rTap(); });
    document.addEventListener("keydown", function (e) {
      if (e.code === "Space" && rRunning) { e.preventDefault(); if (!e.repeat) rTap(); }
    });
    rBpm.addEventListener("input", function () {
      rBpmVal.textContent = rBpm.value;
      if (rRunning) { rStop(); rStart(); }
    });

    /* ---------- Metronome ---------- */
    var running = false, timer = null, beatEl = document.getElementById("beat");
    var bpm = document.getElementById("bpm"), bpmVal = document.getElementById("bpmVal"), mBtn = document.getElementById("metroBtn");
    var n = 0;
    function tick() {
      tone(n % 4 === 0 ? 1000 : 700, 0.08);
      beatEl.classList.add("tick"); setTimeout(function () { beatEl.classList.remove("tick"); }, 100);
      n++;
      timer = setTimeout(tick, 60000 / Number(bpm.value));
    }
    mBtn.addEventListener("click", function () {
      running = !running;
      if (running) { n = 0; tick(); } else { clearTimeout(timer); }
      mBtn.textContent = running ? T[lang].stop : T[lang].start;
    });
    bpm.addEventListener("input", function () { bpmVal.textContent = bpm.value; });

    /* ---------- Langue ---------- */
    function setLang(l) {
      lang = l;
      var d = T[l];
      document.documentElement.lang = l;
      document.documentElement.dir = (l === "ar") ? "rtl" : "ltr";
      document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = d[el.getAttribute("data-i18n")]; });
      document.querySelectorAll(".lang button").forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-lang") === l); });
      mBtn.textContent = running ? d.stop : d.start;
      rBtn.textContent = rRunning ? d.stop : d.start;
      earMsg.textContent = "";
      buildChoices();
      buildReadChoices();
      buildChordChoices();
      buildIntChoices();
      buildHlChoices();
      try { localStorage.setItem("lang", l); } catch (e) {}
    }
    document.querySelectorAll(".lang button").forEach(function (b) {
      b.addEventListener("click", function () { setLang(b.getAttribute("data-lang")); });
    });
    setLang(lang);
    newReadNote();
  </script>
</body>
</html>
