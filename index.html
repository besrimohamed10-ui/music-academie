    function setLang(l) {
      var d = T[l];
      document.documentElement.lang = l;
      document.documentElement.dir = (l === "ar") ? "rtl" : "ltr";
      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        el.textContent = d[el.getAttribute("data-i18n")];
      });
      document.querySelectorAll("[data-i18n-ph]").forEach(function (el) {
        el.placeholder = d[el.getAttribute("data-i18n-ph")];
      });
      document.querySelectorAll(".lang button").forEach(function (b) {
        b.classList.toggle("active", b.getAttribute("data-lang") === l);
      });
      try { localStorage.setItem("lang", l); } catch (e) {}
    }

    document.querySelectorAll(".lang button").forEach(function (b) {
      b.addEventListener("click", function () { setLang(b.getAttribute("data-lang")); });
    });

    document.getElementById("contactForm").addEventListener("submit", function (e) {
      e.preventDefault();
      alert(T[document.documentElement.lang].thanks);
      this.reset();
    });

    var saved = "fr";
    try { saved = localStorage.getItem("lang") || "fr"; } catch (e) {}
    setLang(T[saved] ? saved : "fr");
